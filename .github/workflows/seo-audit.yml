name: SEO audit

on:
  push:
    branches: [main, astro7-security-test]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  seo-audit:
    name: Build, SEO and dependency security validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve and refresh npm lockfile
        run: npm install --package-lock-only
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependency security
        run: npm audit --audit-level=high
      - name: Build static site
        run: npm run build
      - name: Audit SEO output
        run: npm run seo:audit
      - name: Commit refreshed lockfile for test branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/astro7-security-test'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "The npm lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for Astro 7 security update"
          git push
