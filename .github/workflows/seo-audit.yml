name: SEO audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  seo-audit:
    name: Build and validate SEO basics
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report npm dependency audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module -e 'import fs from "node:fs"; const r = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8")); console.log(JSON.stringify({ totals: r.metadata?.vulnerabilities, vulnerabilities: Object.entries(r.vulnerabilities || {}).map(([name, v]) => ({ name, severity: v.severity, range: v.range, fixAvailable: v.fixAvailable, via: v.via.map((x) => typeof x === "string" ? x : ({ name: x.name, title: x.title, url: x.url, range: x.range, severity: x.severity })) })) }, null, 2));'
      - name: Build static site
        run: npm run build
      - name: Audit SEO output
        run: npm run seo:audit
