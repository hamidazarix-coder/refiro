name: SEO audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  seo-audit:
    name: Build, SEO and dependency security validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependency security
        run: npm audit --audit-level=high
      - name: Build static site
        run: npm run build
      - name: Audit SEO output
        run: npm run seo:audit
